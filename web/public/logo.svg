<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Session Slayer</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#7a1410"/>
      <stop offset="100%" stop-color="#140b0a"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f8a3a"/>
      <stop offset="55%" stop-color="#4a5f26"/>
      <stop offset="100%" stop-color="#2c3916"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a06"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#3a2408"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- claw slashes behind the helmet -->
  <g stroke="#e0301e" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="470" y1="70" x2="70" y2="470"/>
    <line x1="430" y1="40" x2="40" y2="430"/>
    <line x1="490" y1="120" x2="120" y2="490"/>
  </g>

  <!-- helmet shell -->
  <path d="M256 70 C340 70 400 130 404 220 L410 300 C412 340 395 375 365 395 L320 430 L300 452 L212 452 L192 430 L147 395 C117 375 100 340 102 300 L108 220 C112 130 172 70 256 70 Z"
        fill="url(#armor)" stroke="#141a0a" stroke-width="8" stroke-linejoin="round"/>

  <!-- crest -->
  <path d="M236 76 L276 76 L270 228 L242 228 Z" fill="#8aa64a" stroke="#141a0a" stroke-width="5" stroke-linejoin="round"/>

  <!-- cheek vents -->
  <g fill="#1e2610">
    <rect x="128" y="320" width="34" height="9" rx="4" transform="rotate(20 145 324)"/>
    <rect x="134" y="342" width="34" height="9" rx="4" transform="rotate(20 151 346)"/>
    <rect x="350" y="320" width="34" height="9" rx="4" transform="rotate(-20 367 324)"/>
    <rect x="344" y="342" width="34" height="9" rx="4" transform="rotate(-20 361 346)"/>
  </g>

  <!-- visor -->
  <path d="M132 240 L236 226 L256 240 L276 226 L380 240 L384 258 L352 302 L290 316 L256 338 L222 316 L160 302 L128 258 Z"
        fill="url(#visor)" stroke="#e0a030" stroke-width="5" stroke-linejoin="round"/>

  <!-- kanban columns reflected in the visor: working / needs input / done -->
  <g>
    <rect x="186" y="254" width="26" height="12" rx="3" fill="#4ade80"/>
    <rect x="186" y="270" width="26" height="12" rx="3" fill="#4ade80"/>
    <rect x="186" y="286" width="26" height="12" rx="3" fill="#4ade80" opacity="0.6"/>
    <rect x="243" y="254" width="26" height="12" rx="3" fill="#f97316"/>
    <rect x="243" y="270" width="26" height="12" rx="3" fill="#f97316" opacity="0.6"/>
    <rect x="300" y="254" width="26" height="12" rx="3" fill="#e6e6e7"/>
    <rect x="300" y="270" width="26" height="12" rx="3" fill="#e6e6e7"/>
    <rect x="300" y="286" width="26" height="12" rx="3" fill="#e6e6e7" opacity="0.6"/>
  </g>

  <!-- chin grill -->
  <g fill="#1e2610">
    <rect x="222" y="372" width="68" height="10" rx="5"/>
    <rect x="226" y="392" width="60" height="10" rx="5"/>
    <rect x="230" y="412" width="52" height="10" rx="5"/>
  </g>
</svg>
